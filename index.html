  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Won-Ringgit Traveler</title>
  </head>
  <body>
  
    <link rel="stylesheet" href="style.css"> 
    <div class="header">
    <h1 class="title">Won-Ringgit Traveler</h1>
  
    <!-- New Nested Container -->
    <div class="currency-display">
     <div id="total-rm-display" class="rm-amount">Total Spent: RM 0.00</div>
      <div id="total-won-display" class="won-amount">Total Spent: ₩ 0 (RM 0.00)</div>
    </div>
    </div>

    <div class="input-section">
    <div class="input-group">
      <label for="won-input">Amount in ₩:</label>
      <input type="number" id="won-input" placeholder="Enter Won amount" autofocus>
    </div>
    <button class="add-btn">Add Expense</button>
    </div>

    <script src="app.js"></script>

  </body>
  </html>
